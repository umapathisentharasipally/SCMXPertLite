<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCMXPertLite Signup</title>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffffff, #f3f4f6);
    }

    .container {
      width: 900px;
      height: 580px;
      background: #ffffff;
      display: flex;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);
    }

    .left-box {
      width: 50%;
      padding: 45px 60px;
      position: relative;
      overflow: hidden;
    }

    .left-box::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      background: radial-gradient(
        circle,
        rgba(255, 210, 120, 0.35),
        rgba(255, 190, 80, 0.18),
        rgba(255, 255, 255, 0)
      );
      border-radius: 45% 55% 60% 40% / 40% 40% 60% 60%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(25px);
    }

    .left-box * {
      position: relative;
      z-index: 1;
    }

    .right-box {
      width: 50%;
      background: #111827;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .right-box::before {
      content: "";
      position: absolute;
      width: 650px;
      height: 650px;
      background: linear-gradient(
        135deg,
        rgba(255, 200, 80, 0.22),
        rgba(255, 170, 50, 0.12),
        rgba(255, 140, 0, 0.05)
      );
      clip-path: polygon(
        0% 20%,
        35% 0%,
        85% 10%,
        100% 50%,
        80% 100%,
        20% 85%,
        0% 60%
      );
      right: -220px;
      bottom: -220px;
      transform: rotate(20deg);
      filter: blur(40px);
      opacity: 1;
    }
    .right-content {
      position: relative;
      z-index: 1;
      padding: 40px;
    }

    .right-content h2 {
      font-size: 34px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .right-content p {
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 40px;
      color: #e5e7eb;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 25px;
      color: #111827;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 22px;
      color: #111827;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      margin-bottom: 10px;
      outline: none;
      background: #f3f4f6;
      font-size: 12px;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.35);
      background: #ffffff;
    }

    .form-error {
      color: #b91c1c;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 5px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: none;
      font-size: 14px;
    }

    .g-recaptcha {
      transform: scale(0.8);
      transform-origin: left;
      margin-bottom: 8px;
    }

    .signup-btn {
      width: 100%;
      background: #f59e0b;
      color: #111827;
      border: none;
      padding: 14px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .signup-btn:hover {
      background: #d97706;
      color: #ffffff;
      transform: translateY(-2px);
    }

    .signin-btn {
      padding: 14px 48px;
      border: 1px solid #fbbf24;
      background: transparent;
      color: #fbbf24;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .signin-btn:hover {
      background: #fbbf24;
      color: #111827;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        width: 95%;
        height: auto;
      }

      .left-box,
      .right-box {
        width: 100%;
      }

      .left-box {
        padding: 40px 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left-box">
      <div class="logo">SCMXPertLite</div>
      <div class="title">Create Account</div>

      <form id="signupForm" onsubmit="handleSignup(event)">
        <label>Full Name*
        <input type="text" id="fullName" placeholder="Enter your full name" required />
        </label>
        <label>Email Address*
        <input type="email" id="email" placeholder="Enter your email" required />
        </label>
        <label>Phone Number*
        <input type="tel" id="phone" placeholder="Enter your phone number" required />
        </label>
        <label>Password*
        <input type="password" id="password" placeholder="Create password" required />
        </label>
        <label>Confirm Password*
        <input type="password" id="confirmPassword" placeholder="Confirm password" required />
        </label>
        <!--<div class="g-recaptcha" data-sitekey="6LfraessAAAAAE2-gWKn0FMfHlyEISTY9oXeglaP"></div> >-->

        <button type="submit" class="signup-btn">SIGN UP</button>
      </form>
      <div id="signupError" class="form-error" role="alert"></div>
    </div>

    <div class="right-box">
      <div class="right-content">
        <h2>Welcome back!</h2>
        <p>Already have an account? Please login with your personal info.</p>

        <button
          type="button"
          class="signin-btn"
          onclick="window.location.href='signin.html'"
        >
          SIGN IN
        </button>
      </div>
    </div>

  </div>

  <script src="../js/auth.js"></script>
  <script>
    function handleSignup(event) {
      event.preventDefault();

      document.getElementById('signupError').style.display = 'none';

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (fullName === "") {
        setFormError('signupError', 'Please enter full name');
        return;
      }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!email.match(emailPattern)) {
        setFormError('signupError', 'Please enter valid email');
        return;
      }

      if (phone === "") {
        setFormError('signupError', 'Please enter phone number');
        return;
      }

      if (password.length < 8) {
        setFormError('signupError', 'Password must be minimum 8 characters');
        return;
      }

      if (password !== confirmPassword) {
        setFormError('signupError', 'Passwords do not match');
        return;
      }

      const userData = {
        fullName,
        email,
        phoneNumber: phone,
        password,
        confirmPassword
      };

      signup(userData);
    }
  </script>

</body>
</html>
